pipeline:
  name: Data Pipeline Provision and Deploy
  identifier: data_pipeline_iacm
  projectIdentifier: data_pipeline_reference
  orgIdentifier: data_engineers
  description: Provision the stable AWS graph, then deploy selected ZIP Lambda releases.
  tags: {}
  stages:
    - stage:
        name: Provision AWS Graph
        identifier: provision_aws_graph
        type: IACM
        description: Manage S3, IAM, Glue, Lambda infrastructure, triggers, Step Functions, and the Harness Service.
        spec:
          workspace: <+input>
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: Plan
                  identifier: plan
                  spec:
                    command: plan
              - step:
                  type: IACMApproval
                  name: Approve Plan
                  identifier: approve_plan
                  timeout: 1d
                  spec: {}
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  spec:
                    command: apply
        variables:
          - name: PLUGIN_AWS_REGION
            type: String
            description: AWS region used by the IaCM plugin and STS.
            required: true
            value: eu-west-2
    - stage:
        name: Deploy Lambda Service
        identifier: deploy_lambda_service
        type: Deployment
        description: Deploy an immutable ZIP to each selected Service created or updated by the IaCM stage.
        spec:
          deploymentType: AwsLambda
          service:
            serviceRef: <+repeat.item>
          environment:
            environmentRef: development
            deployToAll: false
            infrastructureDefinitions:
              - identifier: arrival_lambda_eu_west_2
          execution:
            steps:
              - step:
                  name: Deploy Lambda
                  identifier: deploy_lambda
                  type: AwsLambdaDeploy
                  timeout: 10m
                  spec: {}
            rollbackSteps:
              - step:
                  name: Roll Back Lambda
                  identifier: rollback_lambda
                  type: AwsLambdaRollback
                  timeout: 10m
                  spec: {}
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        strategy:
          repeat:
            items: <+<+pipeline.variables.LAMBDA_SERVICES_TO_DEPLOY>.split(",")>
            maxConcurrency: 2
  variables:
    - name: LAMBDA_SERVICES_TO_DEPLOY
      type: String
      description: Comma-separated deployment subset. Defaults to every ZIP Lambda Service managed by this workspace.
      required: false
      value: <+input>.default(<+pipeline.stages.provision_aws_graph.spec.execution.steps.apply.output.outputVariables.harness_lambda_service_identifiers_csv>)
  allowStageExecutions: true
